<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f5130">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agroguide - बळीराजाचा सोबती</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;800&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1f5130; --green-d:#0f2f1b; --green-m:#2a6b40; --leaf:#3c8a4f; --leaf-l:#dcebd9;
  --turmeric:#f2a900; --turmeric-l:#ffd45c; --bg:#f1f6ee; --card:#ffffff; --ink:#18261c; --muted:#5a6b5e;
  --line:#dbe5d8; --blue:#1565c0; --orange:#d9560b; --red:#b92d2d;
  --radius:18px;
  --shadow-sm:0 2px 8px rgba(15,47,27,.07);
  --shadow:0 10px 30px rgba(15,47,27,.10);
  --shadow-lg:0 22px 50px rgba(15,47,27,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--green-d)}
body{margin:0;font-family:'Mukta','Noto Sans Devanagari',system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.65;
  background-color:var(--bg);background-image:radial-gradient(rgba(31,81,48,.06) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--turmeric);color:var(--green-d)}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---------- NAV ---------- */
header.top{background:rgba(15,47,27,.9);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(242,169,0,.35);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.nav-row{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-weight:800;font-size:1.3rem;cursor:pointer;white-space:nowrap}
.brand>span:first-child{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.4rem!important;
  background:linear-gradient(135deg,#ffd45c,#f2a900);box-shadow:0 4px 12px rgba(242,169,0,.45)}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--turmeric-l);opacity:.95;margin-top:-5px;letter-spacing:.02em}
nav.links{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;align-items:center}
nav.links a{color:#e3efe3;text-decoration:none;padding:9px 11px;border-radius:30px;font-weight:500;font-size:.92rem;white-space:nowrap;cursor:pointer;transition:background .25s,color .25s,transform .2s}
nav.links a:hover{background:rgba(255,255,255,.14);color:#fff}
nav.links a.active{background:linear-gradient(135deg,#ffd45c,#f2a900);color:var(--green-d);font-weight:700;box-shadow:0 4px 14px rgba(242,169,0,.4)}
.nav-tools{display:flex;gap:10px;align-items:center}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:30px;padding:3px;border:1px solid rgba(255,255,255,.15)}
.lang button{border:0;background:transparent;color:#fff;padding:5px 13px;border-radius:30px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s}
.lang button.on{background:#fff;color:var(--green-d);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:40px;border:0;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;
  transition:transform .2s,box-shadow .25s,filter .2s;position:relative}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(0)}
.btn-gold{background:linear-gradient(135deg,#ffd45c 0%,#f2a900 100%);color:var(--green-d);box-shadow:0 8px 22px rgba(242,169,0,.4)}
.btn-gold:hover{box-shadow:0 14px 30px rgba(242,169,0,.55)}
.btn-green{background:linear-gradient(135deg,#2f7d46,#1f5130);color:#fff;box-shadow:0 8px 22px rgba(31,81,48,.35)}
.btn-green:hover{box-shadow:0 14px 30px rgba(31,81,48,.5)}
.btn-line{background:rgba(255,255,255,.08);color:#fff;border:2px solid rgba(255,255,255,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.btn-line:hover{background:rgba(255,255,255,.18)}
.btn-sm{padding:8px 18px;font-size:.9rem}
.nav-tools .btn{white-space:nowrap}
.menu-toggle{display:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;width:44px;height:44px;color:#fff;font-size:1.5rem;cursor:pointer;margin-left:auto}
@media (max-width:1180px){
  .menu-toggle{display:block}
  nav.links{display:none;position:absolute;left:0;right:0;top:68px;background:rgba(15,47,27,.97);flex-direction:column;align-items:stretch;padding:14px 22px 20px;margin:0;border-bottom:3px solid var(--turmeric);box-shadow:0 18px 30px rgba(0,0,0,.35)}
  nav.links.open{display:flex;animation:drop .25s}
  nav.links a{padding:13px 16px}
  .nav-row{flex-wrap:nowrap}
  .nav-tools{margin-left:0}
}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (max-width:520px){ .brand small{display:none} .nav-tools .btn{padding:7px 13px;font-size:.85rem} .brand{font-size:1.15rem} }
@media (max-width:440px){ .brand>span:last-child{display:none} .nav-row{gap:8px} .lang button{padding:5px 10px} .nav-tools{gap:6px} }
@media (max-width:440px){ .brand>span:last-child{display:none} .nav-row{gap:8px} .lang button{padding:5px 10px} .nav-tools{gap:6px} }

/* ---------- PAGES ---------- */
.page{display:none}
.page.active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:52px 0 24px}
.page-title{text-align:center;color:var(--green);font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;margin-bottom:8px}
.page-title::after,.sec-head h2::after{content:"";display:block;width:74px;height:5px;border-radius:6px;background:linear-gradient(90deg,var(--turmeric),var(--leaf));margin:12px auto 0}
.page-sub{text-align:center;color:var(--muted);max-width:640px;margin:14px auto 32px;font-size:1.05rem}

/* ---------- HERO ---------- */
.hero{position:relative;color:#fff;overflow:hidden;border-radius:0 0 50% 50%/0 0 46px 46px;
  background:
    radial-gradient(circle at 82% 18%,rgba(242,169,0,.32),transparent 42%),
    radial-gradient(circle at 8% 92%,rgba(78,170,100,.45),transparent 48%),
    linear-gradient(160deg,#0f2f1b 0%,#1f5130 55%,#2c6a3e 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1.6px,transparent 1.6px);background-size:28px 28px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 85%);mask-image:linear-gradient(180deg,#000 0%,transparent 85%)}
.hero::after{content:"";position:absolute;width:520px;height:520px;right:-140px;bottom:-240px;border-radius:50%;border:60px solid rgba(242,169,0,.1)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;min-height:600px;padding-top:56px;padding-bottom:110px}
.hero h1{font-family:'Tiro Devanagari Marathi','Mukta',serif;font-size:clamp(2.3rem,5.2vw,3.9rem);font-weight:400;margin-bottom:18px;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.hero p.lead{font-size:1.22rem;max-width:520px;color:#e6f1e6;margin:0 0 30px}
.hero .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(242,169,0,.16);color:#ffe08a;border:1px solid rgba(242,169,0,.5);padding:6px 16px;border-radius:30px;font-size:.92rem;font-weight:600;margin-bottom:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero .badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--turmeric);box-shadow:0 0 0 0 rgba(242,169,0,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(242,169,0,0)}100%{box-shadow:0 0 0 0 rgba(242,169,0,0)}}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px}
.hero-art{width:100%;max-width:520px;justify-self:center;position:relative}
.hero-art::before{content:"";position:absolute;inset:-18px -18px 18px 18px;border-radius:28px;border:3px dashed rgba(242,169,0,.55);transform:rotate(-2deg)}
.hero-art svg{width:100%;height:auto;display:block;border-radius:26px;overflow:hidden;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.hero-photo{position:relative;border-radius:26px;overflow:hidden;border:5px solid rgba(255,255,255,.92);box-shadow:var(--shadow-lg),0 0 0 10px rgba(255,255,255,.08);transform:rotate(1.5deg);animation:float 7s ease-in-out infinite}
.hero-photo img{display:block;width:100%;height:auto}
@keyframes float{50%{transform:rotate(1.5deg) translateY(-10px)}}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;min-height:0;padding-bottom:100px;text-align:left}.hero-art{max-width:400px}.hero{border-radius:0 0 40px 40px/0 0 30px 30px}}

.stats{position:relative;z-index:2;margin-top:-58px}
.stats .wrap{max-width:1060px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:28px 22px;background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.stat{text-align:center;position:relative}
.stat+.stat::before{content:"";position:absolute;left:-5px;top:12%;bottom:12%;width:1px;background:var(--line)}
.stat b{display:block;font-size:2.4rem;font-weight:800;line-height:1.1;background:linear-gradient(135deg,var(--green-m),var(--turmeric));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--green)}
.stat span{color:var(--muted);font-size:.95rem;font-weight:500}
@media (max-width:640px){.stats .wrap{grid-template-columns:repeat(2,1fr);gap:20px 10px;margin:0 14px}.stat+.stat::before{display:none}}

section.block{padding:76px 0}
section.block.alt{background:linear-gradient(180deg,#fff 0%,#f6faf4 100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{max-width:660px;margin:0 0 38px}
.sec-head h2{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:800;color:var(--green)}
.sec-head h2::after{margin:12px 0 0}
.sec-head p{color:var(--muted);margin:0;font-size:1.05rem}

.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px}
.feature{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;cursor:pointer;display:flex;gap:18px;align-items:flex-start;text-align:left;font-size:inherit;color:inherit;box-shadow:var(--shadow-sm);
  transition:transform .3s,box-shadow .3s,border-color .3s;overflow:hidden}
.feature::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--turmeric),var(--leaf));transform:scaleY(0);transform-origin:top;transition:transform .35s}
.feature::after{content:"→";position:absolute;right:22px;top:50%;transform:translate(-10px,-50%);font-size:1.5rem;color:var(--leaf);opacity:0;transition:.3s}
.feature:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:#bcd7bf}
.feature:hover::before{transform:scaleY(1)}
.feature:hover::after{opacity:1;transform:translate(0,-50%)}
.feature .ic{font-size:1.9rem;line-height:1;flex:none;width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#eaf6ea,#c8e3cc);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(60,138,79,.15);transition:transform .35s}
.feature:hover .ic{transform:rotate(-8deg) scale(1.1)}
.feature h3{font-size:1.18rem;margin-bottom:5px;color:var(--green-d);font-weight:700}
.feature p{margin:0;color:var(--muted);font-size:.96rem;padding-right:20px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;counter-reset:s}
.step{position:relative;padding:26px 24px 26px 82px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:transform .3s,box-shadow .3s}
.step:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:22px;top:24px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#2f7d46,#1f5130);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem;box-shadow:0 0 0 6px rgba(60,138,79,.15)}
.step h3{font-size:1.12rem;margin-bottom:5px;color:var(--green-d)}
.step p{margin:0;color:var(--muted);font-size:.96rem}

.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:0 22px;box-shadow:var(--shadow-sm);transition:box-shadow .3s,border-color .3s}
.faq details:hover{border-color:#bcd7bf}
.faq details[open]{box-shadow:var(--shadow);border-color:var(--leaf)}
.faq summary{cursor:pointer;padding:18px 0;font-weight:700;color:var(--green-d);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:32px;height:32px;border-radius:50%;background:var(--leaf-l);color:var(--green);display:grid;place-items:center;font-size:1.4rem;line-height:1;transition:.3s}
.faq details[open] summary::after{content:"–";background:var(--turmeric);color:var(--green-d);transform:rotate(180deg)}
.faq details[open] summary{border-bottom:1px solid var(--line);margin-bottom:14px}
.faq details p{margin:0 0 18px;color:var(--muted)}

.cta{position:relative;overflow:hidden;color:#fff;border-radius:30px;padding:60px 30px;text-align:center;margin:0 auto;box-shadow:var(--shadow-lg);
  background:radial-gradient(circle at 15% 20%,rgba(242,169,0,.32),transparent 40%),radial-gradient(circle at 90% 90%,rgba(78,170,100,.5),transparent 45%),linear-gradient(135deg,#1f5130,#0f2f1b)}
.cta::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1.5px,transparent 1.5px);background-size:26px 26px}
.cta>*{position:relative}
.cta h2{font-family:'Tiro Devanagari Marathi','Mukta',serif;font-weight:400;font-size:clamp(1.8rem,4vw,2.5rem)}
.cta p{color:#e0eee0;max-width:560px;margin:0 auto 26px;font-size:1.1rem}

/* ---------- CARDS / SCHEMES ---------- */
.tab-wrapper{display:flex;justify-content:center;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.tab-btn{padding:11px 24px;border:2px solid var(--line);border-radius:40px;cursor:pointer;font-weight:700;background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);transition:.25s}
.tab-btn:hover{border-color:var(--leaf);transform:translateY(-2px)}
.tab-btn.on{background:linear-gradient(135deg,#2f7d46,#1f5130);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(31,81,48,.35)}
.grid-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.content-card{position:relative;padding:26px;border-radius:var(--radius);border:1px solid var(--line);border-top:6px solid var(--c,var(--green));display:flex;flex-direction:column;
  background:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c,#2e7d32) 9%,#fff) 0,#fff 140px);
  box-shadow:var(--shadow-sm);transition:transform .3s,box-shadow .3s}
.content-card:hover{transform:translateY(-7px);box-shadow:var(--shadow-lg)}
.content-card h3{color:var(--green-d);font-size:1.14rem;font-weight:700;padding-bottom:10px;margin-bottom:8px;border-bottom:2px dashed rgba(0,0,0,.08)}
.label{font-weight:700;color:var(--c,#444);display:block;font-size:.9rem;margin-top:10px}
.detail-text{font-size:.96rem;margin:3px 0 8px;line-height:1.6}
.apply-link{display:block;background:var(--c,var(--blue));color:#fff;text-decoration:none;padding:12px;text-align:center;border-radius:12px;font-weight:700;margin-top:auto;
  box-shadow:0 8px 18px rgba(0,0,0,.18);transition:transform .2s,filter .2s,box-shadow .2s}
.apply-link:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.25)}
.search{max-width:480px;margin:0 auto 26px;position:relative}

/* ---------- FORMS ---------- */
.form-card{background:#fff;padding:40px;border-radius:28px;box-shadow:var(--shadow-lg);max-width:540px;margin:0 auto 44px;position:relative;overflow:hidden;border:1px solid var(--line)}
.form-card::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--green),var(--leaf),var(--turmeric))}
.form-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,0,.18),transparent 70%);pointer-events:none}
.form-card h2{text-align:center;color:var(--green);margin-top:8px;font-weight:800}
.form-card .sub{text-align:center;color:var(--muted);margin:0 0 24px}
.input-group{margin-bottom:18px}
.input-group label{display:block;font-weight:700;margin-bottom:7px;font-size:.93rem;color:var(--green-d)}
.form-control{width:100%;padding:14px 16px;border:2px solid #e1e9de;border-radius:14px;font-size:1rem;font-family:inherit;background:#f9fcf8;transition:border-color .2s,box-shadow .2s,background .2s}
.form-control:hover{border-color:#c9dcc8}
.form-control:focus{border-color:var(--leaf);outline:none;background:#fff;box-shadow:0 0 0 5px rgba(60,138,79,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.row2{grid-template-columns:1fr}.form-card{padding:30px 22px}}
.submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,#2f7d46,#1f5130);color:#fff;border:0;border-radius:14px;font-size:1.08rem;font-weight:700;cursor:pointer;
  box-shadow:0 10px 24px rgba(31,81,48,.35);transition:transform .2s,box-shadow .25s,filter .2s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(31,81,48,.45);filter:brightness(1.05)}
.err{color:var(--red);font-size:.9rem;min-height:1.3em;margin:-6px 0 8px;font-weight:600}
.answer-box{background:linear-gradient(135deg,#eaf7ec,#f5fbf1);border-left:6px solid var(--leaf);padding:16px 18px;margin:16px 0;border-radius:12px;box-shadow:var(--shadow-sm)}
.auth-tabs{display:flex;background:#e9f1e6;border-radius:40px;padding:5px;margin-bottom:26px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:40px;cursor:pointer;font-weight:700;color:var(--muted);transition:.25s}
.auth-tabs button.on{background:#fff;color:var(--green);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.pw-wrap{position:relative}
.pw-wrap .form-control{padding-right:76px}
.pw-wrap button{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:var(--leaf-l);border-radius:8px;cursor:pointer;color:var(--green);font-size:.8rem;font-weight:700;padding:6px 10px}
.profile-head{display:flex;gap:18px;align-items:center;margin-bottom:22px;padding-top:6px}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#2f7d46,#143a21);color:#fff;display:grid;place-items:center;font-size:1.9rem;font-weight:800;flex:none;box-shadow:0 0 0 5px #fff,0 0 0 8px var(--turmeric)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 12px;font-size:.98rem;margin-bottom:22px;background:#f6faf4;padding:16px 18px;border-radius:14px;border:1px solid var(--line)}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:700}
.hist{list-style:none;padding:0;margin:0 0 20px}
.hist li{padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--leaf);border-radius:12px;margin-bottom:10px;font-size:.95rem;background:#fff;box-shadow:var(--shadow-sm)}
.hist small{color:var(--muted);display:block}

/* ---------- CROP GUIDE ---------- */
.step-label{font-weight:800;margin:28px 0 14px;display:block;color:var(--green-d);font-size:1.2rem;border-left:6px solid var(--turmeric);padding-left:12px}
.btn-group{display:flex;flex-wrap:wrap;gap:12px}
.choice-btn{padding:13px 26px;border:2px solid var(--green);background:#fff;color:var(--green);cursor:pointer;border-radius:40px;font-weight:700;transition:.25s;box-shadow:var(--shadow-sm)}
.choice-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.choice-btn.on{background:linear-gradient(135deg,#2f7d46,#1f5130);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(31,81,48,.35)}
.hidden{display:none!important}
.info-card{border:1px solid var(--line);margin-top:16px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow-sm)}
.card-header{background:linear-gradient(135deg,#dcebd9,#eef7ec);padding:18px 20px;cursor:pointer;font-weight:700;font-size:1.12rem;color:var(--green-d);display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.card-header:hover{background:linear-gradient(135deg,#cfe6cc,#e4f3e1)}
.card-body{padding:18px;display:none;border-top:1px solid #eee}
.card-body.open{display:block;animation:fade .3s}
.detail-item{margin-bottom:12px;padding:14px 16px;border-radius:12px;background:#f8fbf6;border-left:6px solid var(--leaf);transition:transform .2s,box-shadow .2s}
.detail-item:hover{transform:translateX(4px);box-shadow:var(--shadow-sm)}
.detail-label{color:#c2410c;font-weight:700;display:block;margin-bottom:3px}
.detail-item p{margin:0}
.special-btn{display:block;width:100%;margin:20px 0;padding:17px;border:0;border-radius:60px;font-size:1.12rem;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#f06a1d,#d9560b);box-shadow:0 10px 24px rgba(217,86,11,.35);transition:.25s}
.special-btn.biz{background:linear-gradient(135deg,#0a8dd6,#0277bd);box-shadow:0 10px 24px rgba(2,119,189,.35)}
.special-btn:hover{transform:translateY(-3px);filter:brightness(1.07)}
.exh{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--line);border-left:6px solid var(--turmeric);margin-top:16px;transition:.3s}
.exh:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.web-btn{display:inline-block;padding:10px 22px;background:linear-gradient(135deg,#2f7d46,#1f5130);color:#fff;text-decoration:none;border-radius:12px;font-weight:700;margin-top:6px;box-shadow:0 6px 16px rgba(31,81,48,.3);transition:.2s}
.web-btn:hover{transform:translateY(-2px)}

/* ---------- HELP ---------- */
.bajar{display:flex;flex-wrap:wrap;gap:26px}
.panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;flex:1;min-width:300px;border:1px solid var(--line)}
.panel.docs{border-left:7px solid var(--green)}
.panel h2{color:var(--green);font-size:1.45rem;font-weight:800}
.doc-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px;text-decoration:none;border:1px solid var(--line);border-radius:12px;font-weight:600;background:#fafdf9;transition:.25s}
.doc-item::after{content:"↗";color:var(--leaf);font-size:1.2rem;transition:.25s}
.doc-item:hover{background:var(--leaf-l);border-color:var(--leaf);transform:translateX(5px)}
.doc-item:hover::after{transform:translate(3px,-3px)}
.result-grid{display:none;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.result-grid div{background:linear-gradient(135deg,#e6f3e4,#f4faf2);padding:16px 12px;border-radius:14px;text-align:center;border:1px solid var(--line);font-size:.92rem;color:var(--muted)}
.result-grid b{display:block;font-size:1.35rem;color:var(--green-d);margin-top:2px}
@media (max-width:520px){.result-grid{grid-template-columns:1fr}}

/* ---------- TECH ---------- */
.tech-menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.tech-card{position:relative;background:#fff;padding:32px 18px 28px;border-radius:var(--radius);text-align:center;box-shadow:var(--shadow-sm);cursor:pointer;border:1px solid var(--line);border-bottom:6px solid var(--leaf);
  transition:transform .3s,box-shadow .3s,background .3s,color .3s;font-weight:700;color:var(--green-d);font-size:1.12rem;overflow:hidden}
.tech-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(242,169,0,.25),transparent 60%);opacity:0;transition:.3s}
.tech-card small{display:block;font-weight:500;color:var(--muted);font-size:.9rem;margin-top:6px}
.tech-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg);background:linear-gradient(160deg,#2f7d46,#143a21);color:#fff;border-bottom-color:var(--turmeric)}
.tech-card:hover::before{opacity:1}
.tech-card:hover small{color:#cfe6cf}
#techDetailView{display:none;background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.tech-img{width:100%;max-height:360px;object-fit:cover;display:block;background:var(--leaf-l)}
.back-btn{margin:18px;padding:10px 20px;cursor:pointer;border-radius:40px;border:0;background:linear-gradient(135deg,#3a3a3a,#1d1d1d);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:.2s}
.back-btn:hover{transform:translateX(-4px)}
.tech-body{padding:8px 28px 32px}
.explain{background:linear-gradient(135deg,#eaf6e6,#f6faf2);padding:20px;border-radius:14px;margin-bottom:18px;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.two{grid-template-columns:1fr}.tech-body{padding:8px 18px 26px}}
.usage-box{background:linear-gradient(135deg,#e8f2ff,#f4f9ff);padding:16px 20px;border-radius:14px;border-left:6px solid #2196f3}
.benefit-box{background:linear-gradient(135deg,#e6f7ea,#f3fbf4);padding:16px 20px;border-radius:14px;border-left:6px solid #4caf50}
.buy-box{margin-top:20px;background:linear-gradient(135deg,#fff3d6,#fffaf0);border:1px solid #ffe082;border-left:7px solid #f57c00;padding:16px 20px;border-radius:14px}
.calc-box{background:linear-gradient(135deg,#fffbe0,#fffef5);border:2px dashed #fbc02d;padding:22px;margin-top:24px;border-radius:16px}
.calc-box .line{display:flex;gap:12px;flex-wrap:wrap}
.calc-box input{flex:1;min-width:140px;padding:13px;border-radius:12px;border:2px solid #e8dca0;font-size:1rem;background:#fff}
.calc-box input:focus{outline:none;border-color:var(--turmeric);box-shadow:0 0 0 4px rgba(242,169,0,.2)}
.res-card{background:#fff;padding:16px 18px;border-radius:14px;border-left:6px solid var(--leaf);box-shadow:var(--shadow);margin-top:16px;animation:fade .35s}
ul{padding-left:22px}
li{margin-bottom:4px}

/* ---------- FOOTER / MISC ---------- */
footer{position:relative;color:#cfe3cf;margin-top:70px;padding:56px 0 24px;border-top:5px solid var(--turmeric);
  background:radial-gradient(circle at 90% 0,rgba(242,169,0,.14),transparent 40%),linear-gradient(180deg,#143a21,#0b2314)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:36px}
@media (max-width:720px){.foot-grid{grid-template-columns:1fr}}
footer h4{color:#fff;margin-bottom:14px;font-size:1.1rem}
footer a{display:block;color:#cfe3cf;text-decoration:none;padding:5px 0;cursor:pointer;transition:.2s}
footer a:hover{color:var(--turmeric-l);transform:translateX(5px)}
.copy{border-top:1px solid rgba(255,255,255,.15);margin-top:34px;padding-top:18px;text-align:center;font-size:.92rem;color:#a8c4a8}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:linear-gradient(135deg,#1f5130,#0f2f1b);color:#fff;padding:14px 26px;border-radius:40px;border:1px solid rgba(242,169,0,.5);box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:.35s;z-index:3000;max-width:90vw;text-align:center;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toTop{position:fixed;right:20px;bottom:24px;width:50px;height:50px;border-radius:50%;border:0;background:linear-gradient(135deg,#ffd45c,#f2a900);color:var(--green-d);font-size:1.4rem;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.3);display:none;z-index:900;transition:.2s}
#toTop:hover{transform:translateY(-4px)}


/* ---------- PRICES (official links) ---------- */
.official-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:1000px;margin:0 auto}
.official-card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;text-decoration:none;color:inherit;box-shadow:var(--shadow-sm);transition:transform .3s,box-shadow .3s,border-color .3s}
.official-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--leaf)}
.official-card .oi{font-size:2rem;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#eaf6ea,#c8e3cc);display:grid;place-items:center;margin-bottom:12px}
.official-card h3{margin:0 0 6px;color:var(--green-d)}
.official-card p{margin:0 0 14px;color:var(--muted);font-size:.96rem}
.official-card .go{margin-top:auto;font-weight:700;color:var(--green)}
.mk-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px;margin-bottom:6px}
.mk-inputs input{width:100%;padding:13px;border-radius:12px;border:2px solid #e8dca0;font-size:1rem;background:#fff}
.mk-inputs input:focus{outline:none;border-color:var(--turmeric);box-shadow:0 0 0 4px rgba(242,169,0,.2)}
.mk-note{font-size:.85rem;color:var(--muted);margin:12px 0 0}
.enam-card{margin:34px auto 0;max-width:820px;background:linear-gradient(135deg,#fff8e1,#fffdf5);border:1px solid #ffe082;border-left:8px solid #f57c00;border-radius:18px;padding:26px 28px;box-shadow:var(--shadow)}
.enam-card h3{margin:0 0 8px;color:#b45309;font-weight:800}
.enam-card ol,.enam-card ul{padding-left:22px;margin:10px 0 18px}
.enam-card ul{margin-bottom:0}
.enam-card li{margin-bottom:6px}
.calc-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.calc-res div{background:#fff;border:1px solid var(--line);border-left:6px solid var(--leaf);border-radius:12px;padding:12px 14px}
.calc-res small{display:block;color:var(--muted)}
.calc-res b{font-size:1.25rem;color:var(--green-d)}
.calc-res .net{border-left-color:var(--turmeric);background:#fffbe9}


/* ---------- PEST GUIDE / HELPLINES / SHARE ---------- */
.sym-btn{padding:10px 16px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;border-radius:40px;font-weight:600;transition:.2s;box-shadow:var(--shadow-sm);font-size:.95rem}
.sym-btn:hover{border-color:var(--leaf);transform:translateY(-2px)}
.sym-btn.on{background:linear-gradient(135deg,#f06a1d,#d9560b);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(217,86,11,.3)}
#pgResults{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
#pgResults .pg-head{grid-column:1/-1;font-weight:800;color:var(--green-d);font-size:1.15rem;margin:0}
#pgResults .wx-msg,#pgResults .pg-none{grid-column:1/-1}
.pg-none{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted);box-shadow:var(--shadow-sm)}
.pg-card{background:#fff;border:1px solid var(--line);border-top:6px solid var(--c,#d9560b);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.pg-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.pg-card.dis{--c:#7b3fb0}.pg-card.pest{--c:#d9560b}
.pg-badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;color:#fff;background:var(--c);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.pg-card h3{margin:0 0 8px;color:var(--green-d);font-size:1.18rem}
.pg-match{font-size:.85rem;color:var(--green);font-weight:700;margin-bottom:6px}
.pg-card .lab{font-weight:700;color:var(--c);margin-top:6px}
.pg-card p{margin:2px 0 8px}
.pg-card ul{margin:2px 0 10px;padding-left:20px}
.pg-card li{margin-bottom:4px;font-size:.95rem}
.pg-help{margin:30px auto 0;max-width:820px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#eaf7ec,#f6fbf2);border:1px solid var(--line);border-left:8px solid var(--leaf);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow-sm)}
.pg-help h3{margin:0 0 4px;color:var(--green-d)}
.pg-help p{margin:0;color:var(--muted);font-size:.93rem;max-width:520px}
.doc-item.hl{gap:12px}
.doc-item.hl span{flex:1}
.doc-item.hl small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.doc-item.hl em{font-style:normal;font-weight:800;color:var(--green);white-space:nowrap}
.doc-item.hl::after{content:"📞"}
.share-btn{margin-top:10px;border:0;border-radius:12px;padding:10px;cursor:pointer;font-weight:700;color:#fff;background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 6px 14px rgba(18,140,126,.3);transition:.2s;width:100%;font-size:.95rem}
.share-btn:hover{filter:brightness(1.07);transform:translateY(-2px)}
footer a.hidden{display:none}

/* scroll-reveal (only active when JS adds the "js" class) */
.js .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.js .reveal.in{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap nav-row">
    <a class="brand" onclick="showPage('home')" tabindex="0">
      <span style="font-size:1.6rem">🌾</span>
      <span>Agroguide<small data-i18n="brand_sub"></small></span>

<main>
<!-- ================= HOME ================= -->
<div id="home" class="page active">
  <section class="hero">
    <div class="wrap">
      <div>
        <span class="badge" data-i18n="hero_badge"></span>
        <h1 data-i18n="hero_title"></h1>

          <button class="btn btn-gold" onclick="showPage('schemes')" data-i18n="hero_cta1"></button>
          <button class="btn btn-line" id="heroAuthBtn" onclick="showPage('account','signup')" data-i18n="hero_cta2"></button>
        </div>
      </div>
      <div class="hero-art">
        <div class="hero-photo" id="heroPhoto">
          <img src="https://www1.djicdn.com/cms/uploads/fd7e1258d4e8b9fb2330f68b92170422.gif" alt="Agri drone" onerror="document.getElementById('heroPhoto').style.display='none';document.getElementById('heroSvg').style.display='block'">
        </div>
        <svg id="heroSvg" style="display:none" viewBox="0 0 520 380" aria-hidden="true">
          <circle cx="390" cy="110" r="52" fill="#f2a900"/>
          <path d="M0 210 Q130 170 260 205 T520 190 V380 H0Z" fill="#3c8a4f"/>
          <g stroke="#1f5130" stroke-width="5" fill="none" opacity=".75">
            <path d="M0 250 Q130 215 260 245 T520 232"/><path d="M0 285 Q130 252 260 280 T520 268"/>
            <path d="M0 322 Q130 292 260 318 T520 306"/><path d="M0 360 Q130 334 260 356 T520 346"/>
          </g>
        </svg>

    </div>
  </section>

  <div class="stats"><div class="wrap" id="statsRow"></div></div>

  <section class="block">
    <div class="wrap">
      <div class="sec-head"><h2 data-i18n="feat_title"></h2><p data-i18n="feat_sub"></p></div>
      <div class="feature-grid" id="featureGrid"></div>
    </div>
  </section>

  <section class="block alt">
    <div class="wrap">
      <div class="sec-head"><h2 data-i18n="how_title"></h2><p data-i18n="how_sub"></p></div>

        <div class="step"><h3 data-i18n="how1_t"></h3><p data-i18n="how1_d"></p></div>

        <div class="step"><h3 data-i18n="how3_t"></h3><p data-i18n="how3_d"></p></div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="sec-head"><h2 data-i18n="pop_title"></h2><p data-i18n="pop_sub"></p></div>
      <div class="grid-container" id="homeSchemes"></div>
      <p style="text-align:center;margin-top:26px"><button class="btn btn-green" onclick="showPage('schemes')" data-i18n="view_all"></button></p>
    </div>
  </section>

  <section class="block alt">
    <div class="wrap" style="max-width:820px">
      <div class="sec-head"><h2 data-i18n="faq_title"></h2></div>
      <div class="faq" id="homeFaq"></div>
    </div>
  </section>

  <section class="block">
    <div class="wrap"><div class="cta">
      <h2 data-i18n="cta_title"></h2>
      <p data-i18n="cta_sub"></p>
      <button class="btn btn-gold" onclick="showPage('account','signup')" data-i18n="cta_btn"></button>
    </div></div>
  </section>
</div>

<!-- ================= SCHEMES ================= -->
<div id="schemes" class="page">
  <div class="wrap pad">
    <h2 class="page-title" data-i18n="sch_title"></h2>
    <p class="page-sub" data-i18n="sch_sub"></p>
    <div class="tab-wrapper" id="schemeTabs"></div>
    <div class="search"><input class="form-control" id="schemeSearch" oninput="renderSchemes()" data-i18n-ph="sch_search"></div>

<!-- ================= CROP GUIDE ================= -->
<div id="crops" class="page">
  <div class="wrap pad">
    <h2 class="page-title" data-i18n="crop_title"></h2>
    <p class="page-sub" data-i18n="crop_sub"></p>

    <span class="step-label" data-i18n="crop_s1"></span>

    <button class="special-btn" onclick="toggleSection('expoSection')" data-i18n="expo_btn"></button>
    <div id="expoSection" class="hidden"></div>
  </div>
</div>

<!-- ================= MANDI PRICES (official links + calculator) ================= -->
<div id="market" class="page">
  <div class="wrap pad">
    <h2 class="page-title" data-i18n="mk_title"></h2>
    <p class="page-sub" data-i18n="mk_sub"></p>

    <div class="official-grid">
      <a class="official-card" href="https://enam.gov.in/web/dashboard/agmarknet" target="_blank" rel="noopener">
        <span class="oi">📊</span><h3 data-i18n="mk_c1_t"></h3><p data-i18n="mk_c1_d"></p><span class="go" data-i18n="mk_open"></span></a>
      <a class="official-card" href="https://agmarknet.gov.in/" target="_blank" rel="noopener">
        <span class="oi">🏛️</span><h3 data-i18n="mk_c2_t"></h3><p data-i18n="mk_c2_d"></p><span class="go" data-i18n="mk_open"></span></a>
      <a class="official-card" href="https://enam.gov.in/" target="_blank" rel="noopener">
        <span class="oi">🛒</span><h3 data-i18n="mk_c3_t"></h3><p data-i18n="mk_c3_d"></p><span class="go" data-i18n="mk_open"></span></a>
    </div>

    <div class="calc-box" style="max-width:820px;margin:34px auto 0">
      <h3 style="margin-top:0;color:#f57f17" data-i18n="mkc_title"></h3>
      <p data-i18n="mkc_sub"></p>
      <div class="mk-inputs">
        <div class="input-group"><label for="mkPrice" data-i18n="mkc_price"></label><input id="mkPrice" type="number" min="0" step="any" inputmode="decimal"></div>
        <div class="input-group"><label for="mkQty" data-i18n="mkc_qty"></label><input id="mkQty" type="number" min="0" step="any" inputmode="decimal"></div>
        <div class="input-group"><label for="mkCost" data-i18n="mkc_cost"></label><input id="mkCost" type="number" min="0" step="any" inputmode="decimal"></div>
      </div>
      <button class="btn btn-green" onclick="mkCalc()" data-i18n="mkc_btn"></button>
      <div id="mkCalcOut"></div>

async function handleAgriSubmit(){
  const name = $('name').value.trim(), mobile = $('mobile').value.trim(), q = $('questionSelect').value;
  if (!name || !/^[0-9]{10}$/.test(mobile) || !q){ $('advErr').textContent = t('adv_err'); return; }
  $('advErr').textContent = '';
  const d = await api('queries', 'POST', {name, mobile, question: q});
  if (!d.ok){ $('advErr').textContent = t(d.error || 'e_server'); return; }

function performCalc(silent){
  const l = parseFloat($('lenInput').value), w = parseFloat($('widInput').value);
  if (l > 0 && w > 0){
    const sqft = l*w, guntha = sqft/1089, acre = guntha/40;
    $('outSqft').textContent = num(sqft.toLocaleString('en-IN',{maximumFractionDigits:2}));
    $('outGuntha').textContent = num(guntha.toFixed(2));
    $('outAcre').textContent = num(acre.toFixed(3));
    $('resultArea').style.display = 'grid';
  } else if (!silent){ toast(t('calc_err')); }
}

let me = null;          // logged-in user, loaded from the server
let myQueries = [];     // this user's saved questions

// Talks to Firebase through the module script at the bottom of this page
let fbResolve; const fbReady = new Promise(r => { fbResolve = r; }); window.__fbResolve = fbResolve;
async function api(path, method, body){
  const loaded = await Promise.race([fbReady.then(() => true), new Promise(r => setTimeout(() => r(false), 12000))]);
  if (!loaded || !window.fbApi){ console.warn('Firebase script did not start. Open the browser Console (F12) for the first red error.'); return {ok:false, error:'e_load'}; }
  try{ return await window.fbApi(path, method || 'GET', body || {}); }
  catch(e){ return {ok:false, error:'e_server'}; }
}
function currentUser(){ return me; }
async function loadQueries(){ const d = await api('queries'); myQueries = d.ok ? d.queries : []; }
async function loadMe(){
  const d = await api('me');
  me = d.ok ? d.user : null;
  if (me) await loadQueries(); else myQueries = [];
}

function authTab(which){
  $('loginForm').classList.toggle('hidden', which !== 'login');
  $('signupForm').classList.toggle('hidden', which !== 'signup');
  $('tabLogin').classList.toggle('on', which === 'login');
  $('tabSignup').classList.toggle('on', which === 'signup');
  ['liErr','suErr'].forEach(i => $(i).textContent = '');
}
function togglePw(id, btn){ const i = $(id); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; btn.textContent = show ? t('hide') : t('show'); }

let authBusy = false;
async function doSignup(e){
  e.preventDefault();
  if (authBusy) return false;
  const name = $('suName').value.trim(), mobile = $('suMobile').value.trim(), pw = $('suPass').value, pw2 = $('suPass2').value;
  const err = m => { $('suErr').textContent = t(m); return false; };
  if (name.length < 2) return err('e_name');
  if (!/^[6-9][0-9]{9}$/.test(mobile)) return err('e_mobile');
  if (pw.length < 6) return err('e_pass');
  if (pw !== pw2) return err('e_match');
  authBusy = true;
  const d = await api('signup', 'POST', {name, mobile, password: pw, village: $('suVillage').value.trim(), district: $('suDistrict').value.trim()});
  authBusy = false;
  if (!d.ok) return err(d.error || 'e_server');
  me = d.user; myQueries = [];
  e.target.reset(); toast(t('ok_signup')); renderAuthUI(); renderAccount(); window.scrollTo({top:0});
  return false;
}
async function doLogin(e){
  e.preventDefault();
  if (authBusy) return false;
  const mobile = $('liMobile').value.trim(), pw = $('liPass').value;
  if (!mobile || !pw){ $('liErr').textContent = t('e_fill'); return false; }
  authBusy = true;
  const d = await api('login', 'POST', {mobile, password: pw});
  authBusy = false;
  if (!d.ok){ $('liErr').textContent = t(d.error || 'e_server'); return false; }
  me = d.user; await loadQueries();
  e.target.reset(); $('liErr').textContent = '';
  toast(t('ok_login')); renderAuthUI(); renderAccount(); window.scrollTo({top:0});
  return false;
}
async function doLogout(){
  await api('logout', 'POST', {});
  me = null; myQueries = [];
  toast(t('ok_logout')); renderAuthUI(); renderAccount(); prefillAdvice();
}
function renderAuthUI(){
  const u = currentUser();
  $('authBtn').textContent = u ? '👤 ' + u.name.split(' ')[0] : t('login');
  $('heroAuthBtn').classList.toggle('hidden', !!u);
}
function renderAccount(){
  const u = currentUser();
  $('authCard').classList.toggle('hidden', !!u);
  $('profileCard').classList.toggle('hidden', !u);
  if (!u){ if (!$('tabLogin').classList.contains('on') && !$('tabSignup').classList.contains('on')) authTab('login'); return; }
  $('avatar').textContent = u.name.trim().charAt(0).toUpperCase();
  $('profName').textContent = t('hi') + ', ' + u.name;
  const loc = lang==='mr' ? 'mr-IN' : 'en-IN';
  const d = new Date(u.created).toLocaleDateString(loc, {year:'numeric',month:'long',day:'numeric'});
  $('profKv').innerHTML = `<span>${t('k_mobile')}</span><span>${esc(u.mobile)}</span>` +
    (u.village ? `<span>${t('k_village')}</span><span>${esc(u.village)}</span>` : '') +
    (u.district ? `<span>${t('k_district')}</span><span>${esc(u.district)}</span>` : '') +
    `<span>${t('k_since')}</span><span>${esc(d)}</span>`;
  $('profHist').innerHTML = myQueries.length
    ? myQueries.map(h => `<li>${esc(QA[h.q] ? tr(QA[h.q].q) : h.q)}<small>${new Date(h.ts).toLocaleString(loc)}</small></li>`).join('')
    : `<li>${t('acc_nohist')}</li>`;
}

/* =====================================================================
   PRICES PAGE: sale calculator
   ===================================================================== */
function mkCalc(silent){
  const out = $('mkCalcOut'); if (!out) return;
  const p = parseFloat($('mkPrice').value), q = parseFloat($('mkQty').value), c = parseFloat($('mkCost').value) || 0;
  if (!(p > 0 && q > 0)){ out.innerHTML = ''; if (!silent) toast(t('mkc_err')); return; }
  const gross = p * q, costs = c * q, net = gross - costs, perKg = (p - c) / 100;
  out.innerHTML = `<div class="calc-res">
    <div><small>${t('mkc_gross')}</small><b>${money(gross)}</b></div>
    <div><small>${t('mkc_costs')}</small><b>${money(costs)}</b></div>
    <div class="net"><small>${t('mkc_net')}</small><b>${money(net)}</b></div>
    <div><small>${t('mkc_kg')}</small><b>₹${num(perKg.toFixed(2))}</b></div></div>`;
}

let pgCrop = 'cotton';
const pgSel = new Set();
const pgSteps = o => String(tr(o)).split('|');
function pgPick(c){ pgCrop = c; pgSel.clear(); renderPests(); }
function pgTog(s){ if (pgSel.has(s)) pgSel.delete(s); else pgSel.add(s); renderPests(); }
function pgClear(){ pgSel.clear(); renderPests(); }
function renderPests(){
  const cropsEl = $('pgCrops'); if (!cropsEl) return;
  cropsEl.innerHTML = PG_CROPS.map(c => `<button class="choice-btn ${pgCrop === c[0] ? 'on' : ''}" onclick="pgPick('${c[0]}')">${c[1]} ${esc(tr(c[2]))}</button>`).join('');
  const issues = PG_ISSUES.filter(i => i.c === pgCrop);
  const present = new Set(issues.flatMap(i => i.s));
  $('pgSyms').innerHTML = PG_SYM.filter(s => present.has(s[0])).map(s => `<button class="sym-btn ${pgSel.has(s[0]) ? 'on' : ''}" onclick="pgTog('${s[0]}')">${s[1]} ${t('sym_' + s[0])}</button>`).join('');
  const sel = Array.from(pgSel);
  let list, head;
  if (sel.length){
    list = issues.map(i => ({i, score: i.s.filter(x => pgSel.has(x)).length})).filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score || a.i.s.length - b.i.s.length);
    head = t('pg_best');
  } else { list = issues.map(i => ({i, score: 0})); head = t('pg_all'); }
  if (!list.length){ $('pgResults').innerHTML = `<div class="pg-none">${t('pg_none')}</div>`; return; }
  $('pgResults').innerHTML = `<div class="pg-head">${head}</div>` + list.map(x => {
    const i = x.i, kind = i.t === 'pest' ? 'pest' : 'dis';
    return `<div class="pg-card ${kind}"><span class="pg-badge">${i.t === 'pest' ? '🐛 ' + t('pg_pest') : '🦠 ' + t('pg_dis')}</span>
      <h3>${esc(tr(i.n))}</h3>${sel.length ? `<div class="pg-match">${t('pg_match')}: ${num(x.score)} ${t('pg_of')} ${num(sel.length)}</div>` : ''}
      <div class="lab">${t('pg_look')}</div><p>${esc(tr(i.see))}</p>
      <div class="lab">${t('pg_do')}</div><ul>${pgSteps(i.doit).map(z => `<li>${esc(z)}</li>`).join('')}</ul></div>`;
  }).join('');
}

/* ---------- scroll-reveal animation ---------- */
(function revealSetup(){
  document.documentElement.classList.add('js');
  if (!('IntersectionObserver' in window)) { document.documentElement.classList.remove('js'); return; }
  const SEL = '.feature,.step,.content-card,.faq details,.tech-card,.panel,.info-card,.exh,.cta,.stat,.sec-head,.page-title';
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target; io.unobserve(el);
      el.classList.add('in');
      setTimeout(() => { el.classList.remove('reveal','in'); el.style.transitionDelay = ''; }, 900);   // hand control back to hover styles
    });
  }, {threshold: 0.12});
  let n = 0;
  function scan(){
    document.querySelectorAll(SEL).forEach(el => {
      if (el.dataset.rv) return; el.dataset.rv = '1';
      el.classList.add('reveal'); el.style.transitionDelay = ((n++ % 4) * 80) + 'ms'; io.observe(el);
    });
  }
  let t; new MutationObserver(() => { clearTimeout(t); t = setTimeout(scan, 60); }).observe(document.body, {childList:true, subtree:true});
  scan();
})();

  } catch (e) {
    console.error('Could not start Firebase:', e);
    initError = 'e_load';
  }
}

function mapErr(e){
  const c = (e && e.code) || '';
  if (c === 'auth/email-already-in-use') return 'e_exists';
  if (c === 'auth/weak-password') return 'e_pass';
  if (['auth/invalid-credential','auth/user-not-found','auth/wrong-password','auth/invalid-email'].includes(c)) return 'e_bad';
  if (c === 'auth/too-many-requests') return 'e_rate';
  if (c === 'auth/network-request-failed') return 'e_network';
  if (c === 'auth/unauthorized-domain' || c.startsWith('auth/requests-from-referer')) return 'e_domain';
  if (['auth/operation-not-allowed','auth/configuration-not-found','auth/invalid-api-key','auth/api-key-not-valid.-please-pass-a-valid-api-key.','auth/admin-restricted-operation'].includes(c)) return 'e_config';
  if (c === 'permission-denied') return 'e_rules';
  if (c === 'unavailable' || c === 'failed-precondition' || c === 'not-found') return 'e_db';
  return 'e_server';
}
async function profileOf(u){
  const { F, db } = fb;
  const snap = await F.getDoc(F.doc(db, 'users', u.uid));
  const d = snap.exists() ? snap.data() : {};
  return { id: u.uid, name: d.name || 'Farmer', mobile: d.mobile || (u.email || '').split('@')[0],
           village: d.village || '', district: d.district || '', created: d.created || Date.now() };
}

window.fbApi = async function(path, method, body){
  if (initError) return fail(initError);
  const { Au, F, auth, db } = fb;
  try{
    if (path === 'me'){
      await fb.authReady;
      return { ok:true, user: auth.currentUser ? await profileOf(auth.currentUser) : null };
    }
    if (path === 'signup'){
      const name = clean(body.name, 80), mobile = clean(body.mobile, 10), village = clean(body.village, 80), district = clean(body.district, 80);
      const password = String(body.password ?? '');
      if (name.length < 2) return fail('e_name');
      if (!MOBILE_RE.test(mobile)) return fail('e_mobile');
      if (password.length < 6) return fail('e_pass');
      const cred = await Au.createUserWithEmailAndPassword(auth, mobile + DOMAIN, password);
      const profile = { name, mobile, village, district, created: Date.now() };
      try{ await F.setDoc(F.doc(db, 'users', cred.user.uid), profile); }
      catch(e){ await cred.user.delete().catch(() => {}); throw e; }   // don't leave a half-made account
      return { ok:true, user: { id: cred.user.uid, ...profile } };
    }
    if (path === 'login'){
      const mobile = clean(body.mobile, 10);
      if (!mobile || !body.password) return fail('e_fill');
      const cred = await Au.signInWithEmailAndPassword(auth, mobile + DOMAIN, String(body.password));
      return { ok:true, user: await profileOf(cred.user) };
    }
    if (path === 'logout'){ await Au.signOut(auth); return { ok:true }; }
    if (path === 'queries' && method === 'POST'){
      const name = clean(body.name, 80), mobile = clean(body.mobile, 10), question = clean(body.question, 40);
      if (!name || !MOBILE_RE.test(mobile) || !QUESTION_KEYS.includes(question)) return fail('adv_err');
      await F.addDoc(F.collection(db, 'queries'), { uid: auth.currentUser ? auth.currentUser.uid : null, name, mobile, question, ts: Date.now() });
      return { ok:true };
    }
    if (path === 'queries'){
      if (!auth.currentUser) return fail('e_auth');
      const snap = await F.getDocs(F.query(F.collection(db, 'queries'), F.where('uid', '==', auth.currentUser.uid), F.limit(100)));
      const list = snap.docs.map(d => ({ id: d.id, q: d.data().question, ts: d.data().ts || 0 })).sort((a, b) => b.ts - a.ts);
      return { ok:true, queries: list };
    }
    return fail('e_notfound');
  }catch(e){
    console.error('Firebase error:', e && e.code, e);
    return fail(mapErr(e));
  }
};
window.__fbResolve();
</script>
