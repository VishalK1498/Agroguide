name: Deploy site and update mandi prices

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 13 * * *'      # every day at 19:00 India time
  workflow_dispatch:           # lets you press "Run workflow" by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect the website files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp *.jpeg *.jpg *.png _site/ 2>/dev/null || true

      - name: Download today's mandi prices
        run: node scripts/fetch-prices.mjs _site/data/prices.json
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          PAGES_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/prices.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
